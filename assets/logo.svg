<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="darkMatter" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#6a0dad;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#3e0066;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes drift {
      0% { transform: translate(0, 0); }
      50% { transform: translate(10px, -10px); }
      100% { transform: translate(0, 0); }
    }
    .core {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .swirl {
      animation: rotate 10s linear infinite;
      transform-origin: center;
    }
    .particle {
      animation: drift 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Abyss -->
  <rect width="400" height="400" fill="transparent" />

  <!-- Outer Dark Matter Swirl -->
  <g class="swirl">
    <ellipse cx="200" cy="200" rx="150" ry="100" fill="none" stroke="url(#darkMatter)" stroke-width="2" stroke-dasharray="10 5" opacity="0.3" />
    <ellipse cx="200" cy="200" rx="100" ry="150" fill="none" stroke="#9d4edd" stroke-width="1" stroke-dasharray="5 10" opacity="0.2" />
  </g>

  <!-- Core Intelligence Bubble -->
  <circle class="core" cx="200" cy="200" r="80" fill="url(#darkMatter)" filter="url(#glow)" />
  
  <!-- Internal "Neural" Neurons -->
  <circle class="particle" cx="180" cy="180" r="3" fill="#e0aaff" />
  <circle class="particle" cx="220" cy="190" r="2" fill="#c77dff" style="animation-delay: 1s;" />
  <circle class="particle" cx="190" cy="220" r="4" fill="#9d4edd" style="animation-delay: 2s;" />
  <circle class="particle" cx="210" cy="210" r="2" fill="#7b2cbf" style="animation-delay: 0.5s;" />

  <!-- Terminal Symbol Integration -->
  <text x="200" y="210" font-family="monospace" font-size="40" fill="#ffffff" text-anchor="middle" font-weight="bold" opacity="0.9">V</text>
  
  <!-- Orbital Rings -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#3c096c" stroke-width="0.5" opacity="0.5" />
</svg>
