<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="voidGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#3c096c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10002b;stop-opacity:0" />
    </radialGradient>
    <filter id="abyssalGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes darkMatterPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes neuralDrift {
      0% { transform: translate(0,0); }
      25% { transform: translate(15px, -10px); }
      50% { transform: translate(-10px, 20px); }
      75% { transform: translate(-15px, -15px); }
      100% { transform: translate(0,0); }
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
    }
    .core-sphere {
      animation: darkMatterPulse 6s ease-in-out infinite;
      transform-origin: center;
    }
    .orbital-ring {
      animation: orbitSpin 15s linear infinite;
      transform-origin: center;
    }
    .synapse-particle {
      animation: neuralDrift 4s ease-in-out infinite;
    }
    .void-bubble {
      animation: bubbleRise 3s ease-in infinite;
    }
  </style>

  <!-- Abyssal Background -->
  <rect width="600" height="400" fill="#050505" />

  <!-- The Swirling Void -->
  <g class="orbital-ring">
    <ellipse cx="300" cy="200" rx="180" ry="80" fill="none" stroke="#7b2cbf" stroke-width="0.5" stroke-dasharray="20 10" opacity="0.4" />
    <ellipse cx="300" cy="200" rx="80" ry="180" fill="none" stroke="#5a189a" stroke-width="0.5" stroke-dasharray="10 20" opacity="0.3" />
  </g>

  <!-- Neural Synapses -->
  <circle class="synapse-particle" cx="280" cy="180" r="2" fill="#e0aaff" style="animation-delay: 0s;" />
  <circle class="synapse-particle" cx="320" cy="220" r="3" fill="#c77dff" style="animation-delay: 1s;" />
  <circle class="synapse-particle" cx="290" cy="230" r="1.5" fill="#9d4edd" style="animation-delay: 2s;" />
  <circle class="synapse-particle" cx="310" cy="170" r="2.5" fill="#7b2cbf" style="animation-delay: 0.5s;" />

  <!-- Animated Bubbles -->
  <circle class="void-bubble" cx="290" cy="220" r="5" fill="#9d4edd" opacity="0.5" style="animation-delay: 0.2s;" />
  <circle class="void-bubble" cx="310" cy="210" r="3" fill="#c77dff" opacity="0.4" style="animation-delay: 1.5s;" />
  <circle class="void-bubble" cx="300" cy="230" r="4" fill="#5a189a" opacity="0.3" style="animation-delay: 0.8s;" />

  <!-- The Dark Matter Core -->
  <circle class="core-sphere" cx="300" cy="200" r="70" fill="url(#voidGradient)" filter="url(#abyssalGlow)" />

  <!-- Central Intelligence Symbol -->
  <text x="300" y="215" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#abyssalGlow)">V</text>

  <!-- Connection Lines -->
  <path d="M230,200 Q300,100 370,200" fill="none" stroke="#3c096c" stroke-width="1" opacity="0.2" />
  <path d="M230,200 Q300,300 370,200" fill="none" stroke="#3c096c" stroke-width="1" opacity="0.2" />
</svg>
