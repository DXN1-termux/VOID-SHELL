[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "void-shell"
version = "2.0.0"
description = "A hyper-modular, asynchronous command orchestration layer designed for elite developers and security researchers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "DXN1-termux", email = "dxn1@termux.dev"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Terminals",
    "Topic :: System :: Shells",
    "Topic :: System :: Networking",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Android",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/DXN1-termux/VOID-SHELL"
Documentation = "https://github.com/DXN1-termux/VOID-SHELL/wiki"
Repository = "https://github.com/DXN1-termux/VOID-SHELL"
Issues = "https://github.com/DXN1-termux/VOID-SHELL/issues"
Changelog = "https://github.com/DXN1-termux/VOID-SHELL/releases"

[project.scripts]
void-shell = "void_shell.main:main"
voidshell = "void_shell.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["void_shell*", "void_shell/**/*"]
exclude = ["tests/*", "*.pyc", "__pycache__/*"]

[tool.setuptools.package-data]
void_shell = ["assets/*", "assets/**/*", "config/*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=void_shell --cov-report=html --cov-report=term"

[tool.coverage.run]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "class .*\\.Protocol"
]
ignore_errors = true

[tool.black]
line-length = 120
include = '\\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newlines_in-between = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.flake8]
max-line-length = 120
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "dist",
    "build"
]
select = ["E", "W", "F", "C", "N", "B", "A", "Q"]
ignore = ["E203", "W503"]

[tool.bandit]
targets = ["void_shell"]
exclude = [".venv", "tests", "build"]
severity_level = "HIGH"
confidence_level = "HIGH"

[tool.safety]
dependencies = true

[tool.darglint]
docstring_style = "google"
strictness = "short"

[tool.pyright]
include = ["void_shell"]
exclude = ["**/tests/**", "**/__pycache__"]
pythonVersion = "3.9"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
